name: PR check

# main으로 향하는 PR마다 빌드가 실제로 통과하는지 확인한다.
# 의존성 업그레이드 PR(Dependabot)이 사이트를 깨뜨리는지 여기서 걸러진다.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm install이 아니라 npm ci. package-lock.json에 적힌 버전 그대로 설치해서
      # 로컬과 CI가 다른 버전을 쓰는 상황을 막는다.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub Pages는 PR별 미리보기 URL을 제공하지 않는다.
      # 대신 빌드 결과물을 아티팩트로 올려 PR 페이지에서 내려받아 확인할 수 있게 한다.
      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: dist/
          retention-days: 7
